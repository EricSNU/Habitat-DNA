<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">

  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/pwa-192x192.png">
  <link rel="apple-touch-icon" href="/icons/pwa-192x192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mosquito DNA">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f6f7f9;
      color: #222;
      -webkit-tap-highlight-color: transparent;
    }

    button, select, input {
      touch-action: manipulation;
    }

    .top {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      background: rgba(255,255,255,.98);
      border-bottom: 1px solid #ddd;
      padding: 9px 10px 7px;
    }

    .topline {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center;
      gap: 7px;
    }

    .title {
      font-weight: 800;
      font-size: 21px;
      white-space: nowrap;
    }

    #spotSelect {
      min-width: 0;
      width: 100%;
      padding: 9px 9px;
      border: 1px solid #cfd3d8;
      border-radius: 10px;
      background: white;
      font-size: 16px;
    }

    .refresh {
      border: 0;
      background: #eef0f3;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-size: 18px;
    }

    .lockRow {
      display: grid;
      grid-template-columns: auto auto minmax(0,1fr);
      align-items: center;
      gap: 7px;
      margin-top: 8px;
    }

    .lockBtn {
      border: 1px solid #cfd3d8;
      background: #f3f4f6;
      color: #222;
      border-radius: 10px;
      min-height: 38px;
      padding: 8px 11px;
      font-size: 14px;
      font-weight: 800;
      white-space: nowrap;
    }

    .lockBtn.unlocked {
      background: #fff3cd;
      border-color: #f0c36d;
    }

    .zoomResetBtn {
      border: 1px solid #cfd3d8;
      background: #f3f4f6;
      color: #222;
      border-radius: 10px;
      min-height: 42px;
      padding: 9px 11px;
      font-size: 15px;
      font-weight: 800;
      white-space: nowrap;
    }

    .zoomResetBtn.active {
      background: #e8f0fe;
      border-color: #8ab4f8;
    }

    .lockHelp {
      min-width: 0;
      font-size: 12.5px;
      line-height: 1.3;
      color: #666;
    }

    .labelManageRow {
      display: grid;
      grid-template-columns: auto auto auto minmax(0,1fr);
      align-items: center;
      gap: 7px;
      margin-top: 7px;
    }

    .labelLockBtn,
    .labelActionBtn {
      border: 1px solid #cfd3d8;
      border-radius: 10px;
      min-height: 40px;
      padding: 8px 11px;
      font-size: 14px;
      font-weight: 850;
      white-space: nowrap;
    }

    .labelLockBtn {
      background: #f3f4f6;
      color: #222;
    }

    .labelLockBtn.unlocked {
      background: #fff3cd;
      border-color: #f0c36d;
    }

    .labelActionBtn {
      background: #fff;
      color: #222;
    }

    .labelActionBtn.add {
      border-color: #a7d7ba;
      background: #f0fff5;
    }

    .labelActionBtn.delete {
      border-color: #e2b6b6;
      background: #fff5f5;
    }

    .labelActionBtn:disabled {
      opacity: .42;
      cursor: default;
    }

    .labelManageHelp {
      min-width: 0;
      font-size: 12px;
      line-height: 1.25;
      color: #666;
    }

    .tabs {
      display: flex;
      gap: 4px;
      margin-top: 9px;
      width: 100%;
      max-width: none;
      min-width: 330px;
      overflow: visible;
    }

    .tab {
      flex: 1 1 0;
      width: auto;
      max-width: none;
      min-width: 0;
      min-height: 54px;
      border: 1px solid #d7dbe0;
      background: #fff;
      border-radius: 11px;
      padding: 9px 2px;
      font-size: 18px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
    }

    .tab.active {
      border-color: #444;
      background: #222;
      color: #fff;
    }

    .filterHidden {
      display: none !important;
    }

    .speciesFilterRow {
      display: grid;
      grid-template-columns: auto minmax(0,1fr) auto;
      align-items: center;
      gap: 7px;
      margin-top: 7px;
    }

    .speciesFilterLabel {
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
      color: #444;
    }

    #speciesFilter {
      min-width: 0;
      width: 100%;
      height: 38px;
      padding: 6px 9px;
      border: 1px solid #cfd3d8;
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      font-weight: 700;
    }

    #speciesFilterCount {
      min-width: 52px;
      text-align: right;
      font-size: 12px;
      font-weight: 800;
      color: #666;
      white-space: nowrap;
    }

    .syncbar {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
      min-height: 17px;
      font-size: 12.5px;
      color: #777;
    }

    .syncbar .pending {
      font-weight: 700;
    }

    .offline {
      color: #b45309;
      font-weight: 700;
    }

    #content {
      position: fixed;
      top: var(--topbar-height, 180px);
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 100vw;
      padding: 0 6px 90px;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      touch-action: none;
      scrollbar-gutter: stable;
      scroll-behavior: auto;
      background: #f6f7f9;
    }


    /*
      v4.2: true visual zoom.
      The body table keeps its ORIGINAL geometry and is magnified with transform: scale().
      A spacer supplies the scaled scrollable width/height.
    */

    .tableHead {
      display: grid;
      align-items: center;
      gap: 2px;
      width: var(--visual-table-width, 100%);
      min-width: var(--visual-table-width, 100%);
      max-width: none;
      overflow: visible;
    }

    .zoomSpacer {
      position: relative;
      width: var(--visual-table-width, 100%);
      min-width: var(--visual-table-width, 100%);
      height: var(--visual-table-height, auto);
    }

    .zoomSurface {
      position: absolute;
      top: 0;
      left: 0;
      width: var(--base-table-width, 100%);
      transform-origin: 0 0;
      transform: scale(var(--table-scale, 1));
      overflow: visible;
      will-change: transform;
      contain: layout style;
    }

    .zoomSurface .dataRow {
      display: grid;
      align-items: center;
      gap: 2px;
      width: 100%;
      min-width: 100%;
      max-width: none;
      overflow: visible;
    }

    .tableHead {
      position: sticky;
      top: 0;
      z-index: 50;
      isolation: isolate;
      background: #f6f7f9;
      padding: 15px 2px 14px;
      min-height: var(--visual-head-height, 64px);
      font-size: var(--visual-head-font-size, 22px);
      font-weight: 900;
      color: #333;
      border-bottom: 2px solid #cfd3d8;
      margin-bottom: 5px;
      box-shadow: 0 2px 0 rgba(0,0,0,.06);
    }

    .dataRow {
      position: relative;
      z-index: 1;
      background: #fff;
      margin-bottom: 4px;
      padding: 7px 2px;
      border-radius: 9px;
      box-shadow: 0 1px 2px rgba(0,0,0,.05);
      min-height: 60px;
    }


    .tableHead > *,
    .zoomSurface .dataRow > * {
      min-width: 0;
      max-width: 100%;
    }

    .dataRow.pendingRow {
      box-shadow:
        inset 3px 0 0 #d97706,
        0 1px 2px rgba(0,0,0,.05);
    }

    .label {
      position: sticky;
      left: 0;
      z-index: 5;
      width: 105px;
      min-width: 105px;
      max-width: 105px;
      font-weight: 800;
      padding-left: 5px;
      padding-right: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      background: #fff;
      box-shadow: 2px 0 0 rgba(0,0,0,.10);
      align-self: stretch;
      display: flex;
      align-items: center;
    }

    .tableHead .label {
      z-index: 60;
      width: var(--visual-label-width, 105px);
      min-width: var(--visual-label-width, 105px);
      max-width: var(--visual-label-width, 105px);
      background: #f6f7f9;
    }


    .zoomSurface .label {
      position: static;
      visibility: hidden;
      box-shadow: none;
    }

    .labelRail {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 35;
      width: var(--visual-label-width, 105px);
      pointer-events: none;
      will-change: transform;
    }

    .labelRailItem {
      width: 100%;
      display: flex;
      align-items: center;
      padding-left: 5px;
      padding-right: 6px;
      background: #fff;
      border-radius: 9px 0 0 9px;
      box-shadow: 2px 0 0 rgba(0,0,0,.10);
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #222;
    }

    .labelRailItem.pending {
      box-shadow:
        inset 3px 0 0 #d97706,
        2px 0 0 rgba(0,0,0,.10);
    }

    .cell {
      min-width: 0;
      text-align: center;
      font-size: 16px;
    }

    input[type="checkbox"] {
      width: 34px;
      height: 34px;
      accent-color: #222;
      margin: 0;
    }

    input[type="checkbox"]:disabled {
      opacity: .55;
    }

    select.species {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      padding: 9px 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    select.species:disabled {
      background: #f0f1f3;
      color: #777;
      opacity: 1;
    }

    .empty,
    .loading {
      text-align: center;
      color: #777;
      padding: 45px 10px;
    }

    .statsBtn {
      position: fixed;
      right: 14px;
      bottom: calc(16px + env(safe-area-inset-bottom));
      z-index: 40;
      border: 0;
      border-radius: 999px;
      background: #222;
      color: white;
      min-height: 56px;
      padding: 16px 23px;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: .2px;
      box-shadow: 0 6px 20px rgba(0,0,0,.28);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0,0,0,.45);
      padding: 18px;
      overflow-y: auto;
    }

    .modal.show {
      display: block;
    }

    .modalBox {
      background: white;
      max-width: 640px;
      margin: 20px auto;
      border-radius: 16px;
      padding: 16px;
    }

    .modalTop {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modalTop h2 {
      margin: 0;
      font-size: 19px;
    }

    .closeBtn {
      border: 0;
      background: #eee;
      border-radius: 8px;
      width: 36px;
      height: 36px;
      font-size: 20px;
    }

    .statCard {
      border: 1px solid #e1e3e6;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .statCard h3 {
      margin: 0 0 9px;
      font-size: 16px;
    }

    .statLine {
      display: grid;
      grid-template-columns: 72px 1fr 78px;
      align-items: center;
      gap: 8px;
      margin: 8px 0;
      font-size: 13px;
    }

    .bar {
      height: 8px;
      background: #eceff2;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > div {
      height: 100%;
      background: #444;
    }

    .speciesGrid {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 12px;
      font-size: 13px;
    }

    @media (min-width: 700px) {
      .top {
        padding-left: 16px;
        padding-right: 16px;
      }

      #content {
        padding-left: 14px;
        padding-right: 14px;
      }

      .tab {
        min-height: 58px;
        font-size: 19px;
      }

      .label {
        font-size: 15px;
      }

      input[type="checkbox"] {
        width: 32px;
        height: 32px;
      }

      .dataRow {
        min-height: 58px;
      }
    }
  </style>
</head>

<body>
  <div class="top" id="topBar">
    <div class="topline">
      <div class="title">🦟 Mosquito DNA</div>
      <select id="spotSelect"></select>
      <button class="refresh" onclick="refreshCurrent()" title="새로고침">↻</button>
    </div>

    <div class="lockRow">
      <button id="lockBtn" class="lockBtn" onclick="toggleEditLock()">
        🔒 편집 잠금
      </button>

      <button id="zoomResetBtn" class="zoomResetBtn" onclick="resetTableZoom()">
        100%
      </button>

      <div id="lockHelp" class="lockHelp">
        기본은 잠금 상태입니다. 실수 방지를 위해 수정할 때만 잠금을 풀어주세요.
      </div>
    </div>

    <div class="labelManageRow">
      <button id="labelLockBtn" class="labelLockBtn" onclick="toggleLabelLock()">
        🔒 Label 잠금
      </button>

      <button id="labelAddBtn" class="labelActionBtn add" onclick="queueAddLabel()" disabled>
        ＋ Label
      </button>

      <button id="labelDeleteBtn" class="labelActionBtn delete" onclick="deleteLastLabelFromApp()" disabled>
        − 마지막
      </button>

      <div id="labelManageHelp" class="labelManageHelp">
        Label 관리는 별도 잠금입니다.
      </div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="speciesFilterRow">
      <span class="speciesFilterLabel">Multi 필터</span>
      <select id="speciesFilter" aria-label="Multiplex species filter"></select>
      <span id="speciesFilterCount">전체</span>
    </div>

    <div class="syncbar">
      <span id="syncText"></span>
      <span id="pendingText" class="pending"></span>
    </div>
  </div>

  <div id="content">
    <div class="loading">불러오는 중...</div>
  </div>

  <button class="statsBtn" onclick="openStats()">📊 통계</button>

  <div class="modal" id="statsModal" onclick="modalBackgroundClose(event)">
    <div class="modalBox">
      <div class="modalTop">
        <h2 id="statsTitle">통계</h2>
        <button class="closeBtn" onclick="closeStats()">×</button>
      </div>
      <div id="statsContent">
        <div class="loading">불러오는 중...</div>
      </div>
    </div>
  </div>

<script>

  /*
    Standalone PWA bridge.
    The original app was written for google.script.run inside Apps Script.
    On the standalone PWA we emulate that API and route calls through /api.
  */
  const PWA_ACCESS_CODE_KEY = 'mosquito:pwaAccessCode';

  function getPwaAccessCode() {
    let code = localStorage.getItem(PWA_ACCESS_CODE_KEY) || '';

    while (!code) {
      const entered = window.prompt(
        'Mosquito DNA 접속 코드를 입력해주세요.\n(이 기기에는 한 번 입력하면 저장됩니다.)'
      );

      if (entered === null) {
        throw new Error('접속 코드 입력이 취소되었습니다.');
      }

      code = entered.trim();
    }

    localStorage.setItem(PWA_ACCESS_CODE_KEY, code);
    return code;
  }

  async function pwaApiCall(action, args) {
    const accessCode = getPwaAccessCode();

    const response = await fetch('/api', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-App-Code': accessCode
      },
      body: JSON.stringify({
        action,
        args
      }),
      cache: 'no-store'
    });

    let data = null;

    try {
      data = await response.json();
    } catch (e) {
      throw new Error(
        '서버 응답을 읽지 못했습니다. (' + response.status + ')'
      );
    }

    if (response.status === 401) {
      localStorage.removeItem(PWA_ACCESS_CODE_KEY);
      throw new Error(
        '접속 코드가 올바르지 않습니다. 새로고침 후 다시 입력해주세요.'
      );
    }

    if (!response.ok || !data || data.ok !== true) {
      throw new Error(
        (data && data.error) ||
        ('서버 요청 실패 (' + response.status + ')')
      );
    }

    return data.result;
  }

  function createPwaRunner(successHandler=null, failureHandler=null) {
    return new Proxy({}, {
      get(target, prop) {
        if (prop === 'withSuccessHandler') {
          return fn =>
            createPwaRunner(fn, failureHandler);
        }

        if (prop === 'withFailureHandler') {
          return fn =>
            createPwaRunner(successHandler, fn);
        }

        return (...args) => {
          pwaApiCall(String(prop), args)
            .then(result => {
              if (successHandler) {
                successHandler(result);
              }
            })
            .catch(error => {
              if (failureHandler) {
                failureHandler(error);
              } else {
                console.error(error);
              }
            });
        };
      }
    });
  }

  // Only create the shim outside the Apps Script HTML runtime.
  if (
    !window.google ||
    !window.google.script ||
    !window.google.script.run
  ) {
    window.google = window.google || {};

    const scriptBridge = {};

    Object.defineProperty(
      scriptBridge,
      'run',
      {
        configurable: false,
        enumerable: true,
        get() {
          return createPwaRunner();
        }
      }
    );

    window.google.script = scriptBridge;
  }

  const UI_FIELDS = {
    'ITS2': [
      {key:'pcr', label:'PCR', type:'check'},
      {key:'gel', label:'Gel', type:'check'},
      {key:'seq', label:'Seq', type:'check'}
    ],
    'COI': [
      {key:'pcr', label:'PCR', type:'check'},
      {key:'gel', label:'Gel', type:'check'},
      {key:'band', label:'Band+', type:'check'},
      {key:'seq', label:'Seq', type:'check'}
    ],
    'kdr': [
      {key:'pcr', label:'PCR', type:'check'},
      {key:'gel', label:'Gel', type:'check'},
      {key:'band', label:'Band+', type:'check'},
      {key:'seq', label:'Seq', type:'check'}
    ],
    'ace-1': [
      {key:'pcr', label:'PCR', type:'check'},
      {key:'gel', label:'Gel', type:'check'},
      {key:'band', label:'Band+', type:'check'},
      {key:'seq', label:'Seq', type:'check'}
    ],
    'Multiplex': [
      {key:'species', label:'Species', type:'select'}
    ]
  };

  const STORAGE_PENDING = 'mosquito:v3:pending';
  const STORAGE_CACHE_PREFIX = 'mosquito:v3:cache:';
  const SYNC_DELAY_MS = 1100;

  let appConfig = null;
  let currentSpot = '';
  let currentTarget = 'COI';

  // Species filter is LOCAL ONLY.
  // Changing this does not call Apps Script or Cloudflare.
  const SPECIES_FILTER_ALL = '__ALL__';
  const SPECIES_FILTER_IDENTIFIED = '__IDENTIFIED__';
  const SPECIES_FILTER_EMPTY = '__EMPTY__';

  let currentSpeciesFilter =
    localStorage.getItem('mosquito:speciesFilter') ||
    SPECIES_FILTER_ALL;

  // 기본값은 항상 잠금
  let editUnlocked = false;

  // Label 생성/삭제는 체크박스 편집과 별도 잠금
  let labelUnlocked = false;

  // Label add/delete는 optimistic UI:
  // 화면을 먼저 바꾸고 서버 저장은 뒤에서 처리합니다.
  let labelAddQueue = 0;
  let labelAddTimer = null;
  let labelAddBusy = false;
  let labelQueueBaseLastLabel = '';
  let labelOpSpot = '';
  let labelDeleteBusy = false;
  let labelRenderFrame = null;
  let labelCacheTimer = null;

  // 표 자체 pinch zoom 상태
  let tableScale = 1;
  const MIN_TABLE_SCALE = 1;
  const MAX_TABLE_SCALE = 2.5;

  const activePointers = new Map();
  let lastPinchDistance = 0;

  // Smooth pan / inertia state
  let panFrame = null;
  let pendingScrollX = 0;
  let pendingScrollY = 0;
  let scrollVelocityX = 0;
  let scrollVelocityY = 0;
  let inertiaFrame = null;
  let labelSyncFrame = null;
  let gestureHadPinch = false;

  let memoryCache = {};
  let pending = loadPending();
  let syncTimer = null;
  let syncing = false;
  let syncAgain = false;




  function updateZoomTableWidth() {
    updateTableWidthFromScale();
  }

  function updateFixedLayout() {
    const topBar = document.getElementById('topBar');
    if (!topBar) return;

    const h = Math.ceil(topBar.getBoundingClientRect().height);
    document.documentElement.style.setProperty(
      '--topbar-height',
      h + 'px'
    );

    updateZoomTableWidth();
  }

  function init() {
    updateFixedLayout();
    setupPinchZoom();
    setTimeout(updateFixedLayout, 150);
    setTimeout(updateTableWidthFromScale, 350);
    updateNetworkState();
    updatePendingStatus();
    updateLockUI();
    updateLabelLockUI();

    google.script.run
      .withSuccessHandler(config => {
        appConfig = config;
        buildSpotSelect();
        buildTabs();
        buildSpeciesFilter();

        const savedSpot = localStorage.getItem('mosquito:lastSpot');
        currentSpot = config.spots.includes(savedSpot)
          ? savedSpot
          : (config.spots[0] || '');

        const savedTarget = localStorage.getItem('mosquito:lastTarget');
        currentTarget = UI_FIELDS[savedTarget]
          ? savedTarget
          : 'COI';

        document.getElementById('spotSelect').value = currentSpot;
        updateActiveTab();
        loadCurrent();

        if (navigator.onLine && Object.keys(pending).length) {
          scheduleSync(300);
        }
      })
      .withFailureHandler(showFatal)
      .getAppConfig();
  }


  function clampTableScale(scale) {
    return Math.min(
      MAX_TABLE_SCALE,
      Math.max(MIN_TABLE_SCALE, scale)
    );
  }

  function pointerDistance(points) {
    const values = Array.from(points.values());
    if (values.length < 2) return 0;

    const a = values[0];
    const b = values[1];

    return Math.hypot(
      b.x - a.x,
      b.y - a.y
    );
  }

  function pointerMidpoint(points) {
    const values = Array.from(points.values());
    if (values.length < 2) {
      return { x: 0, y: 0 };
    }

    return {
      x: (values[0].x + values[1].x) / 2,
      y: (values[0].y + values[1].y) / 2
    };
  }

  function applyTableScale(nextScale, anchorClientX=null) {
    const content = document.getElementById('content');
    const surface = document.getElementById('zoomSurface');
    const spacer = document.getElementById('zoomSpacer');
    const head = document.querySelector('.tableHead');

    if (!content || !surface || !spacer || !head) return;

    const oldScale = tableScale;
    tableScale = clampTableScale(nextScale);

    const baseWidth =
      Number(surface.dataset.baseWidth) ||
      surface.offsetWidth ||
      Math.max(280, content.clientWidth - 12);

    const baseHeight =
      surface.offsetHeight || 1;

    const visualWidth =
      Math.ceil(baseWidth * tableScale);

    const visualHeight =
      Math.ceil(baseHeight * tableScale);

    document.documentElement.style.setProperty(
      '--table-scale',
      tableScale
    );

    document.documentElement.style.setProperty(
      '--base-table-width',
      baseWidth + 'px'
    );

    document.documentElement.style.setProperty(
      '--visual-table-width',
      visualWidth + 'px'
    );

    document.documentElement.style.setProperty(
      '--visual-table-height',
      visualHeight + 'px'
    );

    document.documentElement.style.setProperty(
      '--visual-label-width',
      (105 * tableScale) + 'px'
    );

    // Header stays clearly readable even when the body table is zoomed.
    // It grows more gently than the body, so it does not consume too much height.
    const headScale = Math.min(
      1.34,
      1 + (tableScale - 1) * 0.23
    );

    document.documentElement.style.setProperty(
      '--visual-head-font-size',
      (22 * headScale).toFixed(1) + 'px'
    );

    document.documentElement.style.setProperty(
      '--visual-head-height',
      Math.round(64 * headScale) + 'px'
    );

    head.style.gridTemplateColumns =
      headerGridTemplate(
        UI_FIELDS[currentTarget],
        tableScale
      );

    if (
      anchorClientX !== null &&
      oldScale > 0 &&
      tableScale !== oldScale
    ) {
      const rect = content.getBoundingClientRect();

      const anchorX =
        anchorClientX -
        rect.left +
        content.scrollLeft;

      const ratio =
        tableScale / oldScale;

      content.scrollLeft +=
        anchorX * ratio - anchorX;
    }

    refreshLabelRail();
    scheduleLabelRailSync();
    updateZoomResetUI();
  }

  function resetTableZoom() {
    tableScale = 1;

    const content = document.getElementById('content');

    if (content) {
      content.scrollLeft = 0;
    }

    applyTableScale(1);
  }

  function updateZoomResetUI() {
    const btn = document.getElementById('zoomResetBtn');
    if (!btn) return;

    const pct = Math.round(tableScale * 100);

    btn.textContent = pct + '%';

    btn.classList.toggle(
      'active',
      tableScale > 1.01
    );
  }


  function stopInertia() {
    if (inertiaFrame) {
      cancelAnimationFrame(inertiaFrame);
      inertiaFrame = null;
    }
  }

  function flushPendingPan() {
    panFrame = null;

    const content =
      document.getElementById('content');

    if (!content) {
      pendingScrollX = 0;
      pendingScrollY = 0;
      return;
    }

    if (
      pendingScrollX !== 0 ||
      pendingScrollY !== 0
    ) {
      content.scrollLeft +=
        pendingScrollX;

      content.scrollTop +=
        pendingScrollY;

      pendingScrollX = 0;
      pendingScrollY = 0;

      scheduleLabelRailSync();
    }
  }

  function queueSmoothPan(dx, dy, dtMs) {
    pendingScrollX += dx;
    pendingScrollY += dy;

    const dt =
      Math.max(4, Math.min(40, dtMs || 16));

    const frameFactor =
      16.67 / dt;

    const instantVX =
      dx * frameFactor;

    const instantVY =
      dy * frameFactor;

    // Low-pass filtering avoids jumpy velocity estimates.
    scrollVelocityX =
      scrollVelocityX * 0.72 +
      instantVX * 0.28;

    scrollVelocityY =
      scrollVelocityY * 0.72 +
      instantVY * 0.28;

    if (!panFrame) {
      panFrame =
        requestAnimationFrame(
          flushPendingPan
        );
    }
  }

  function startInertia() {
    stopInertia();

    let vx = scrollVelocityX;
    let vy = scrollVelocityY;

    scrollVelocityX = 0;
    scrollVelocityY = 0;

    // Ignore tiny movements that should feel like taps.
    if (
      Math.abs(vx) < 0.45 &&
      Math.abs(vy) < 0.45
    ) {
      return;
    }

    const content =
      document.getElementById('content');

    if (!content) return;

    const tick = () => {
      content.scrollLeft += vx;
      content.scrollTop += vy;

      scheduleLabelRailSync();

      // Friction tuned for a short, natural mobile momentum.
      vx *= 0.91;
      vy *= 0.91;

      if (
        Math.abs(vx) < 0.18 &&
        Math.abs(vy) < 0.18
      ) {
        inertiaFrame = null;
        return;
      }

      inertiaFrame =
        requestAnimationFrame(tick);
    };

    inertiaFrame =
      requestAnimationFrame(tick);
  }

  function setupPinchZoom() {
    const content = document.getElementById('content');

    if (
      !content ||
      content.dataset.pointerZoomReady === '1'
    ) {
      return;
    }

    content.dataset.pointerZoomReady = '1';

    content.addEventListener(
      'scroll',
      scheduleLabelRailSync,
      { passive: true }
    );

    const pointerDown = event => {
      if (event.pointerType !== 'touch') return;

      stopInertia();

      try {
        content.setPointerCapture(event.pointerId);
      } catch (e) {}

      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY,
          t: performance.now()
        }
      );

      if (activePointers.size === 1) {
        gestureHadPinch = false;
        scrollVelocityX = 0;
        scrollVelocityY = 0;
      }

      if (activePointers.size === 2) {
        gestureHadPinch = true;

        lastPinchDistance =
          pointerDistance(activePointers);

        scrollVelocityX = 0;
        scrollVelocityY = 0;

        event.preventDefault();
      }
    };

    const pointerMove = event => {
      if (
        event.pointerType !== 'touch' ||
        !activePointers.has(event.pointerId)
      ) {
        return;
      }

      const previous =
        activePointers.get(event.pointerId);

      const now =
        performance.now();

      activePointers.set(
        event.pointerId,
        {
          x: event.clientX,
          y: event.clientY,
          t: now
        }
      );

      // Two fingers: pinch zoom.
      if (activePointers.size >= 2) {
        event.preventDefault();

        gestureHadPinch = true;

        const distance =
          pointerDistance(activePointers);

        if (
          lastPinchDistance > 0 &&
          distance > 0
        ) {
          const ratio =
            distance / lastPinchDistance;

          const midpoint =
            pointerMidpoint(activePointers);

          applyTableScale(
            tableScale * ratio,
            midpoint.x
          );
        }

        lastPinchDistance = distance;
        return;
      }

      // One finger: smooth pan, committed once per animation frame.
      if (
        activePointers.size === 1 &&
        previous
      ) {
        event.preventDefault();

        const dx =
          previous.x - event.clientX;

        const dy =
          previous.y - event.clientY;

        const dt =
          now - (previous.t || now - 16);

        queueSmoothPan(
          dx,
          dy,
          dt
        );
      }
    };

    const pointerUp = event => {
      if (event.pointerType !== 'touch') return;

      const sizeBefore =
        activePointers.size;

      activePointers.delete(event.pointerId);

      if (activePointers.size < 2) {
        lastPinchDistance = 0;
      }

      // When a pinch becomes a one-finger gesture, reset motion history
      // to avoid a sudden jump.
      if (
        sizeBefore >= 2 &&
        activePointers.size === 1
      ) {
        scrollVelocityX = 0;
        scrollVelocityY = 0;

        const now =
          performance.now();

        for (const [id, point] of activePointers.entries()) {
          activePointers.set(
            id,
            {
              x: point.x,
              y: point.y,
              t: now
            }
          );
        }
      }

      if (activePointers.size === 0) {
        if (!gestureHadPinch) {
          startInertia();
        } else {
          scrollVelocityX = 0;
          scrollVelocityY = 0;
        }

        gestureHadPinch = false;
      }
    };

    content.addEventListener(
      'pointerdown',
      pointerDown,
      { passive: false }
    );

    content.addEventListener(
      'pointermove',
      pointerMove,
      { passive: false }
    );

    content.addEventListener(
      'pointerup',
      pointerUp,
      { passive: true }
    );

    content.addEventListener(
      'pointercancel',
      pointerUp,
      { passive: true }
    );

    content.addEventListener(
      'lostpointercapture',
      pointerUp,
      { passive: true }
    );
  }

  function updateTableWidthFromScale() {
    const content = document.getElementById('content');
    const surface = document.getElementById('zoomSurface');

    if (!content || !surface) return;

    const availableWidth =
      Math.max(
        280,
        content.clientWidth - 12
      );

    surface.dataset.baseWidth =
      String(availableWidth);

    surface.style.width =
      availableWidth + 'px';

    applyTableScale(tableScale);
  }

  function toggleEditLock() {

    applyEditStateToControls();
    requestAnimationFrame(updateFixedLayout);

  function toggleLabelLock() {

    updateLabelLockUI();

  function updateLabelLockUI() {
    const lockBtn =
      document.getElementById('labelLockBtn');

    const addBtn =
      document.getElementById('labelAddBtn');

    const deleteBtn =
      document.getElementById('labelDeleteBtn');

    const help =
      document.getElementById('labelManageHelp');

    }

    if (labelUnlocked) {

  function updateLabelAddButton() {
    const addBtn =
      document.getElementById('labelAddBtn');

    const deleteBtn =
      document.getElementById('labelDeleteBtn');

    if (!addBtn || !deleteBtn) return;

    addBtn.disabled =
      !labelUnlocked ||
      !navigator.onLine;

    deleteBtn.disabled =
      !labelUnlocked ||
      !navigator.onLine ||
      labelDeleteBusy ||
      labelAddBusy ||
      labelAddQueue > 0;

    if (labelAddQueue > 0) {
      addBtn.textContent =
        `＋ Label · ${labelAddQueue} 저장대기`;
    } else if (labelAddBusy) {
      addBtn.textContent =
        '＋ Label · 저장 중';
    } else {
      addBtn.textContent =
        '＋ Label';
    }

    if (labelDeleteBusy) {
      deleteBtn.textContent =
        '− 삭제 중';
    } else {
      deleteBtn.textContent =
        '− 마지막';
    }
  }

  function invalidateSpotCaches(spot) {
    if (!spot) return;

    Object.keys(UI_FIELDS).forEach(target => {
      delete memoryCache[
        viewKey(spot, target)
      ];

      localStorage.removeItem(
        storageCacheKey(spot, target)
      );
    });
  }

  function parseLabelSequence(label) {
    const text =
      String(label || '').trim();

    const m =
      text.match(/^(.*?)(\d+)$/);

    if (!m) {
      return null;
    }

    return {
      prefix: m[1],
      number: Number(m[2]),
      width: m[2].length
    };
  }

  function formatNextLabel(label) {
    const parsed =
      parseLabelSequence(label);

    if (!parsed) {
      throw new Error(
        '마지막 Label의 숫자 규칙을 읽을 수 없습니다: ' +
        label
      );
    }

    const next =
      parsed.number + 1;

    let numText =
      String(next);

    if (
      parsed.width > 1 &&
      numText.length < parsed.width
    ) {
      numText =
        numText.padStart(
          parsed.width,
          '0'
        );
    }

    return (
      parsed.prefix +
      numText
    );
  }

  function makeBlankTargetRow(
    target,
    row,
    label
  ) {
    const item = {
      row,
      label,
      multiplexSpecies: ''
    };

    (UI_FIELDS[target] || [])
      .forEach(field => {
        item[field.key] =
          field.type === 'check'
            ? false
            : '';
      });

    return item;
  }

  function scheduleLabelRender() {
    if (labelRenderFrame) return;

    labelRenderFrame =
      requestAnimationFrame(() => {
        labelRenderFrame = null;

        const rows =
          memoryCache[viewKey()];

        if (rows) {
          renderTable(rows);
        }
      });
  }

  function scheduleSpotCacheSave(spot) {
    clearTimeout(labelCacheTimer);

    labelCacheTimer =
      setTimeout(() => {
        Object.keys(UI_FIELDS)
          .forEach(target => {
            const key =
              viewKey(spot, target);

            if (memoryCache[key]) {
              saveLocalCache(
                spot,
                target,
                memoryCache[key]
              );
            }
          });
      }, 80);
  }

  function appendOptimisticLabel(
    spot,
    label,
    row
  ) {
    let updatedAny = false;

    Object.keys(UI_FIELDS)
      .forEach(target => {
        const key =
          viewKey(spot, target);

        const rows =
          memoryCache[key];

        if (!rows) return;

        const existing =
          rows.some(
            r =>
              Number(r.row) === Number(row) ||
              r.label === label
          );

        if (existing) return;

        rows.push(
          makeBlankTargetRow(
            target,
            row,
            label
          )
        );

        updatedAny = true;
      });

    if (updatedAny) {
      scheduleSpotCacheSave(spot);

      if (spot === currentSpot) {
        const currentRows =
          memoryCache[viewKey()] || [];

        const addedRow =
          currentRows.find(
            r =>
              Number(r.row) === Number(row) &&
              r.label === label
          );

        if (addedRow) {
          appendCurrentRowDom(
            addedRow
          );
        } else {
          scheduleLabelRender();
        }
      }
    }
  }

  function getCurrentLastRow() {
    const rows =
      memoryCache[viewKey()] || [];

    return rows.length
      ? rows[rows.length - 1]
      : null;
  }

  function hasPendingForSpotRow(
    spot,
    row
  ) {
    return Object.values(pending)
      .some(ch =>
        ch.spot === spot &&
        Number(ch.row) === Number(row)
      );
  }

  function hasActiveLabelAdd(
    spot=currentSpot
  ) {
    return (
      labelOpSpot === spot &&
      (
        labelAddBusy ||
        labelAddQueue > 0
      )
    );
  }

  function queueAddLabel() {
    if (!labelUnlocked) return;

    if (!navigator.onLine) {
      alert(
        'Label 추가는 서버 연결이 필요합니다.'
      );
      return;
    }

    if (
      labelDeleteBusy
    ) {
      alert(
        'Label 삭제 처리가 끝난 뒤 추가해주세요.'
      );
      return;
    }

    if (
      labelOpSpot &&
      labelOpSpot !== currentSpot &&
      (
        labelAddBusy ||
        labelAddQueue > 0
      )
    ) {
      alert(
        '다른 Spot의 Label 저장이 끝난 뒤 추가해주세요.'
      );
      return;
    }

    const last =
      getCurrentLastRow();

    if (!last) {
      alert(
        '마지막 Label을 확인할 수 없습니다.'
      );
      return;
    }

    let nextLabel;

    try {
      nextLabel =
        formatNextLabel(
          last.label
        );
    } catch (error) {
      alert(
        getErrorMessage(error)
      );
      return;
    }

    const nextRow =
      Number(last.row) + 1;

    if (
      appConfig &&
      Number.isFinite(appConfig.lastRow) &&
      nextRow > appConfig.lastRow
    ) {
      alert(
        'Label 최대 행을 초과합니다.'
      );
      return;
    }

    // 새 batch가 시작될 때 서버가 현재 갖고 있어야 할 마지막 Label 저장.
    if (
      labelAddQueue === 0
    ) {
      labelQueueBaseLastLabel =
        last.label;
    }

    labelOpSpot =
      currentSpot;

    // 화면에는 즉시 추가.
    appendOptimisticLabel(
      currentSpot,
      nextLabel,
      nextRow
    );

    labelAddQueue += 1;

    setSync(
      `Label ${labelAddQueue}개 저장 대기`
    );

    updateLabelAddButton();

    clearTimeout(labelAddTimer);

    // 연속 탭은 하나의 서버 요청으로 묶습니다.
    labelAddTimer =
      setTimeout(
        processQueuedLabelAdds,
        360
      );
  }

  function reconcileSpotFromServer(
    spot,
    message=''
  ) {
    invalidateSpotCaches(
      spot
    );

    if (
      currentSpot === spot
    ) {
      loadCurrent(true);
    }

    if (message) {
      setSync(message);
    }
  }

  function processQueuedLabelAdds() {
    clearTimeout(labelAddTimer);

    if (
      labelAddBusy ||
      labelAddQueue <= 0
    ) {
      return;
    }

    if (!navigator.onLine) {
      setSync(
        '오프라인 — Label 저장 대기'
      );
      return;
    }

    const count =
      labelAddQueue;

    const expectedPreviousLabel =
      labelQueueBaseLastLabel;

    const spotAtSend =
      labelOpSpot || currentSpot;

    labelAddQueue = 0;
    labelQueueBaseLastLabel = '';
    labelAddBusy = true;

    updateLabelAddButton();

    setSync(
      `Label ${count}개 저장 중...`
    );

    google.script.run
      .withSuccessHandler(result => {
        labelAddBusy = false;

        const added =
          Number(
            result?.added || count
          );

        const lastLabel =
          result?.lastLabel || '';

        // Optimistic rows remain on-screen.
        // No server reload here: that was the main source of perceived delay.
        setSync(
          lastLabel
            ? `Label ${added}개 저장됨 ✓ · ${lastLabel}`
            : `Label ${added}개 저장됨 ✓`
        );

        updateLabelAddButton();

        if (labelAddQueue > 0) {
          labelAddTimer =
            setTimeout(
              processQueuedLabelAdds,
              120
            );

          return;
        }

        labelOpSpot = '';

        // Newly-created rows may already have optimistic checkbox changes.
        // Send those only after the Label rows are confirmed on the server.
        if (
          Object.keys(pending).length
        ) {
          scheduleSync(80);
        } else {
          setTimeout(() => {
            if (
              !labelAddBusy &&
              labelAddQueue === 0 &&
              !syncing
            ) {
              setSync('');
            }
          }, 1200);
        }
      })
      .withFailureHandler(err => {
        labelAddBusy = false;
        labelAddQueue = 0;
        labelQueueBaseLastLabel = '';
        labelOpSpot = '';

        updateLabelAddButton();

        // Server did not accept the structural change.
        // Re-read only on failure and discard optimistic additions.
        reconcileSpotFromServer(
          spotAtSend,
          'Label 추가 실패 — Sheet 값으로 복원 중'
        );

        alert(
          'Label 추가에 실패했습니다.\n' +
          getErrorMessage(err)
        );
      })
      .addLabels(
        spotAtSend,
        count,
        expectedPreviousLabel
      );
  }

  function removeLastOptimistically(
    spot,
    row,
    label
  ) {
    const snapshot = {
      spot,
      row,
      label,
      byKey: {}
    };

    Object.keys(UI_FIELDS)
      .forEach(target => {
        const key =
          viewKey(spot, target);

        const rows =
          memoryCache[key];

        if (
          !rows ||
          rows.length === 0
        ) {
          return;
        }

        const last =
          rows[rows.length - 1];

        if (
          Number(last.row) !== Number(row) ||
          last.label !== label
        ) {
          return;
        }

        snapshot.byKey[key] =
          last;

        rows.pop();
      });

    scheduleSpotCacheSave(
      spot
    );

    if (spot === currentSpot) {
      removeCurrentLastRowDom(
        row
      );
    }

    return snapshot;
  }

  function restoreOptimisticDelete(
    snapshot
  ) {
    if (!snapshot) return;

    Object.entries(
      snapshot.byKey || {}
    ).forEach(
      ([key, row]) => {
        const rows =
          memoryCache[key];

        if (!rows) return;

        const exists =
          rows.some(
            r =>
              Number(r.row) ===
                Number(row.row)
          );

        if (!exists) {
          rows.push(row);
        }
      }
    );

    scheduleSpotCacheSave(
      snapshot.spot
    );

    if (
      snapshot.spot === currentSpot
    ) {
      const restored =
        snapshot.byKey[
          viewKey(
            snapshot.spot,
            currentTarget
          )
        ];

      if (restored) {
        appendCurrentRowDom(
          restored
        );
      } else {
        scheduleLabelRender();
      }
    }
  }

  function deleteLastLabelFromApp() {
    if (!labelUnlocked) return;

    if (!navigator.onLine) {
      alert(
        'Label 삭제는 서버 연결이 필요합니다.'
      );
      return;
    }

    if (
      labelAddBusy ||
      labelAddQueue > 0
    ) {
      alert(
        'Label 추가 저장이 끝난 뒤 삭제해주세요.'
      );
      return;
    }

    if (labelDeleteBusy) {
      return;
    }

    const last =
      getCurrentLastRow();

    if (!last) {
      alert(
        '마지막 Label을 확인할 수 없습니다.'
      );
      return;
    }

    if (
      hasPendingForSpotRow(
        currentSpot,
        last.row
      )
    ) {
      alert(
        '마지막 Label에 아직 저장되지 않은 변경사항이 있습니다.\n' +
        '저장이 완료된 뒤 삭제해주세요.'
      );
      return;
    }

    const ok =
      confirm(
        `${last.label}을(를) 삭제하시겠습니까?\n\n` +
        '맨 마지막 Label만 삭제됩니다.'
      );

    if (!ok) return;

    const spotAtSend =
      currentSpot;

    const expectedLabel =
      last.label;

    const snapshot =
      removeLastOptimistically(
        spotAtSend,
        last.row,
        last.label
      );

    labelDeleteBusy = true;
    updateLabelAddButton();

    setSync(
      `${expectedLabel} 삭제 저장 중...`
    );

    google.script.run
      .withSuccessHandler(result => {
        labelDeleteBusy = false;
        updateLabelAddButton();

        setSync(
          `${result?.removedLabel || expectedLabel} 삭제됨 ✓`
        );

        setTimeout(() => {
          if (
            !labelDeleteBusy &&
            !labelAddBusy &&
            labelAddQueue === 0 &&
            !syncing
          ) {
            setSync('');
          }
        }, 1200);
      })
      .withFailureHandler(err => {
        labelDeleteBusy = false;

        // Server rejected deletion (e.g. data existed).
        // Restore immediately from local snapshot.
        restoreOptimisticDelete(
          snapshot
        );

        updateLabelAddButton();

        setSync(
          '삭제 취소 — Label 복원됨'
        );

        alert(
          'Label을 삭제하지 못했습니다.\n' +
          getErrorMessage(err)
        );
      })
      .deleteLastLabel(
        spotAtSend,
        expectedLabel
      );
  }


  function buildSpotSelect() {
    const sel = document.getElementById('spotSelect');
    sel.innerHTML = '';

    appConfig.spots.forEach(spot => {
      const o = document.createElement('option');
      o.value = spot;
      o.textContent = spot;
      sel.appendChild(o);
    });

    sel.onchange = () => {
      const nextSpot =
        sel.value;

      if (
        labelAddBusy ||
        labelAddQueue > 0 ||
        labelDeleteBusy
      ) {
        alert(
          'Label 저장/삭제 처리가 끝난 뒤 Spot을 변경해주세요.'
        );

        sel.value =
          currentSpot;

        return;
      }

      currentSpot =
        nextSpot;

      labelUnlocked = false;
      updateLabelLockUI();
      localStorage.setItem('mosquito:lastSpot', currentSpot);
      const content = document.getElementById('content');
      if (content) {
        content.scrollTop = 0;
        content.scrollLeft = 0;
      }

      tableScale = 1;
      requestAnimationFrame(() => {
        updateZoomTableWidth();
        updateTableWidthFromScale();
      });
      loadCurrent();
    };

  function buildSpeciesFilter() {
    const sel =
      document.getElementById('speciesFilter');

    if (!sel || !appConfig) return;

    sel.innerHTML = '';

    const addOption = (
      value,
      text
    ) => {
      const o =
        document.createElement('option');

      o.value =
        value;

      o.textContent =
        text;

      sel.appendChild(o);
    };

    addOption(
      SPECIES_FILTER_ALL,
      '전체'
    );

    addOption(
      SPECIES_FILTER_IDENTIFIED,
      '동정 완료 (8종)'
    );

    appConfig.species.forEach(sp => {
      addOption(
        sp,
        sp
      );
    });

    addOption(
      SPECIES_FILTER_EMPTY,
      '미입력'
    );

    const valid =
      currentSpeciesFilter === SPECIES_FILTER_ALL ||
      currentSpeciesFilter === SPECIES_FILTER_IDENTIFIED ||
      currentSpeciesFilter === SPECIES_FILTER_EMPTY ||
      appConfig.species.includes(
        currentSpeciesFilter
      );

    if (!valid) {
      currentSpeciesFilter =
        SPECIES_FILTER_ALL;
    }

    sel.value =
      currentSpeciesFilter;

    sel.onchange = () => {
      currentSpeciesFilter =
        sel.value;

      localStorage.setItem(
        'mosquito:speciesFilter',
        currentSpeciesFilter
      );

      const content =
        document.getElementById('content');

      if (content) {
        content.scrollTop = 0;
      }

      // Pure local DOM filtering: no server request.
      applySpeciesFilterDom();
    };
  }

  function getRowMultiplexSpecies(row) {
    return String(
      row?.multiplexSpecies ??
      row?.species ??
      ''
    ).trim();
  }

  function speciesMatchesFilter(species) {
    const sp =
      String(species || '').trim();

    if (
      currentSpeciesFilter ===
      SPECIES_FILTER_ALL
    ) {
      return true;
    }

    if (
      currentSpeciesFilter ===
      SPECIES_FILTER_EMPTY
    ) {
      return sp === '';
    }

    if (
      currentSpeciesFilter ===
      SPECIES_FILTER_IDENTIFIED
    ) {
      // Eight named Anopheles species only.
      // Excludes blank, No band, and 결과 애매.
      return sp.startsWith('An. ');
    }

    return (
      sp === currentSpeciesFilter
    );
  }

  function updateSpeciesFilterCount(
    visible,
    total
  ) {
    const el =
      document.getElementById(
        'speciesFilterCount'
      );

    if (!el) return;

    if (
      currentSpeciesFilter ===
      SPECIES_FILTER_ALL
    ) {
      el.textContent =
        `전체 ${total}`;
    } else {
      el.textContent =
        `${visible}개 표시`;
    }
  }

  function applySpeciesFilterDom() {
    const surface =
      document.getElementById(
        'zoomSurface'
      );

    const rail =
      document.getElementById(
        'labelRail'
      );

    if (!surface || !rail) {
      const rows =
        memoryCache[viewKey()] || [];

      const visible =
        rows.filter(
          r =>
            speciesMatchesFilter(
              getRowMultiplexSpecies(r)
            )
        ).length;

      updateSpeciesFilterCount(
        visible,
        rows.length
      );

      return;
    }

    const rows =
      Array.from(
        surface.querySelectorAll(
          '.dataRow'
        )
      );

    const rails =
      new Map(
        Array.from(
          rail.querySelectorAll(
            '.labelRailItem'
          )
        ).map(el => [
          String(el.dataset.row),
          el
        ])
      );

    let visible = 0;

    rows.forEach(el => {
      const match =
        speciesMatchesFilter(
          el.dataset.species || ''
        );

      el.classList.toggle(
        'filterHidden',
        !match
      );

      const railEl =
        rails.get(
          String(el.dataset.row)
        );

      if (railEl) {
        railEl.classList.toggle(
          'filterHidden',
          !match
        );
      }

      if (match) {
        visible++;
      }
    });

    updateSpeciesFilterCount(
      visible,
      rows.length
    );

    // Recalculate transformed table height after hiding/showing rows.
    requestAnimationFrame(() => {
      applyTableScale(
        tableScale
      );

      scheduleLabelRailSync();
    });
  }

  function propagateMultiplexSpecies(
    spot,
    rowNumber,
    species
  ) {
    Object.keys(UI_FIELDS)
      .forEach(target => {
        const rows =
          memoryCache[
            viewKey(
              spot,
              target
            )
          ];

        if (!rows) return;

        const row =
          rows.find(
            r =>
              Number(r.row) ===
              Number(rowNumber)
          );

        if (!row) return;

        row.multiplexSpecies =
          species;

        if (
          target ===
          'Multiplex'
        ) {
          row.species =
            species;
        }
      });

    scheduleSpotCacheSave(
      spot
    );
  }

  function buildTabs() {
    const box = document.getElementById('tabs');
    box.innerHTML = '';

    Object.keys(UI_FIELDS).forEach(target => {
      const b = document.createElement('button');
      b.className = 'tab';
      b.dataset.target = target;
      b.textContent = target === 'Multiplex' ? 'Multi' : target;

      b.onclick = () => {
        currentTarget = target;
        localStorage.setItem('mosquito:lastTarget', currentTarget);
        updateActiveTab();
        const content = document.getElementById('content');
        if (content) {
          content.scrollTop = 0;
          content.scrollLeft = 0;
        }

        tableScale = 1;
        requestAnimationFrame(() => {
          updateZoomTableWidth();
          updateTableWidthFromScale();
        });
        loadCurrent();
      };

      box.appendChild(b);
    });
  }

  function updateActiveTab() {
    document.querySelectorAll('.tab').forEach(el => {
      el.classList.toggle(
        'active',
        el.dataset.target === currentTarget
      );
    });
  }

  function viewKey(spot=currentSpot, target=currentTarget) {
    return spot + '::' + target;
  }

  function storageCacheKey(spot=currentSpot, target=currentTarget) {
    return STORAGE_CACHE_PREFIX + viewKey(spot, target);
  }

  function loadCurrent(force=false) {
    if (!currentSpot || !currentTarget) return;

    const key = viewKey();

    if (!force && memoryCache[key]) {
      applyPendingOverlay(
        memoryCache[key],
        currentSpot,
        currentTarget
      );
      renderTable(memoryCache[key]);
    } else if (!force) {
      const cached = loadLocalCache(
        currentSpot,
        currentTarget
      );

      if (cached) {
        memoryCache[key] = cached.rows;
        applyPendingOverlay(
          memoryCache[key],
          currentSpot,
          currentTarget
        );
        renderTable(memoryCache[key]);
      } else {
        document.getElementById('content').innerHTML =
          '<div class="loading">불러오는 중...</div>';
      }
    } else {
      document.getElementById('content').innerHTML =
        '<div class="loading">불러오는 중...</div>';
    }

    if (
      navigator.onLine &&
      !hasActiveLabelAdd(currentSpot)
    ) {
      google.script.run
        .withSuccessHandler(rows => {
          memoryCache[key] = rows;

          applyPendingOverlay(
            memoryCache[key],
            currentSpot,
            currentTarget
          );

          saveLocalCache(
            currentSpot,
            currentTarget,
            rows
          );

          if (key === viewKey()) {
            renderTable(rows);
          }
        })
        .withFailureHandler(err => {
          setSync('서버 새로고침 실패 — 캐시 화면 사용 중');
          console.error(err);
        })
        .getTargetData(
          currentSpot,
          currentTarget
        );
    }
  }

  function refreshCurrent() {
    if (!navigator.onLine) {
      setSync('오프라인 상태입니다.');
      return;
    }

    delete memoryCache[viewKey()];
    localStorage.removeItem(storageCacheKey());
    loadCurrent(true);
  }


  function buildDataRowElement(row, fields) {
    const el =
      document.createElement('div');

    el.className =
      'dataRow';

    el.dataset.row =
      row.row;

    el.dataset.species =
      getRowMultiplexSpecies(row);

    el.style.gridTemplateColumns =
      gridTemplate(fields);

    if (
      rowHasPending(
        currentSpot,
        currentTarget,
        row.row
      )
    ) {
      el.classList.add('pendingRow');
    }

    // Invisible label keeps original geometry.
    const label =
      document.createElement('div');

    label.className =
      'label';

    label.textContent =
      row.label;

    label.title =
      row.label;

    el.appendChild(label);

    fields.forEach(field => {
      const cell =
        document.createElement('div');

      cell.className =
        'cell';

      if (field.type === 'check') {
        const cb =
          document.createElement('input');

        cb.type =
          'checkbox';

        cb.checked =
          row[field.key] === true;

        cb.disabled =
          !editUnlocked;

        cb.onchange = () => {
          const previous =
            row[field.key] === true;

          const next =
            cb.checked;

          if (
            previous &&
            !next
          ) {
            const ok =
              confirm(
                `${row.label} · ${currentTarget} ${field.label}\n` +
                `완료 체크를 해제하시겠습니까?`
              );

            if (!ok) {
              cb.checked = true;
              return;
            }
          }

          row[field.key] =
            next;

          queueChange(
            row.row,
            field.key,
            next
          );

          el.classList.add(
            'pendingRow'
          );

          const railItem =
            document.querySelector(
              `.labelRailItem[data-row="${row.row}"]`
            );

          if (railItem) {
            railItem.classList.add(
              'pending'
            );
          }
        };

        cell.appendChild(cb);
      }

      if (field.type === 'select') {
        const sel =
          document.createElement('select');

        sel.className =
          'species';

        sel.disabled =
          !editUnlocked;

        const blank =
          document.createElement('option');

        blank.value =
          '';

        blank.textContent =
          '미입력';

        sel.appendChild(blank);

        appConfig.species.forEach(sp => {
          const o =
            document.createElement('option');

          o.value =
            sp;

          o.textContent =
            sp;

          sel.appendChild(o);
        });

        sel.value =
          row[field.key] || '';

        sel.onchange = () => {
          row[field.key] =
            sel.value;

          row.multiplexSpecies =
            sel.value;

          // Keep every already-loaded target cache in sync locally.
          propagateMultiplexSpecies(
            currentSpot,
            row.row,
            sel.value
          );

          el.dataset.species =
            sel.value;

          queueChange(
            row.row,
            field.key,
            sel.value
          );

          el.classList.add(
            'pendingRow'
          );

          const railItem =
            document.querySelector(
              `.labelRailItem[data-row="${row.row}"]`
            );

          if (railItem) {
            railItem.dataset.species =
              sel.value;

            railItem.classList.add(
              'pending'
            );
          }

          // If a species filter is active, update visibility immediately.
          applySpeciesFilterDom();
        };

        cell.appendChild(sel);
      }

      el.appendChild(cell);
    });

    return el;
  }

  function buildLabelRailItem(row) {

      row.label;

    if (
      rowHasPending(
        currentSpot,
        currentTarget,
        row.row

      railLabel.classList.add(

  function removeCurrentLastRowDom(rowNumber) {
    const surface =
      document.getElementById('zoomSurface');

    const rail =
      document.getElementById('labelRail');

    if (!surface || !rail) {
      scheduleLabelRender();
      return;
    }

    const rowEl =
      surface.querySelector(
        `.dataRow[data-row="${rowNumber}"]`
      );

      rail.querySelector(

  function renderTable(rows) {
    const content =
      document.getElementById('content');

    const fields =
      UI_FIELDS[currentTarget];

    if (!rows || rows.length === 0) {
      content.innerHTML =
        '<div class="empty">표시할 Label이 없습니다.</div>';

      updateSpeciesFilterCount(
        0,
        0
      );

      return;
    }

    content.innerHTML = '';

    const head =
      document.createElement('div');

    head.className =
      'tableHead';

    head.style.gridTemplateColumns =
      headerGridTemplate(
        fields,
        tableScale
      );

    head.innerHTML =
      '<div class="label">Label</div>' +
      fields.map(
        f =>
          `<div class="cell">${escapeHtml(f.label)}</div>`
      ).join('');

    content.appendChild(head);

    const spacer =
      document.createElement('div');

    spacer.id =
      'zoomSpacer';

    spacer.className =
      'zoomSpacer';

    const surface =
      document.createElement('div');

    surface.id =
      'zoomSurface';

    surface.className =
      'zoomSurface';

    spacer.appendChild(surface);

    const rail =
      document.createElement('div');

    rail.id =
      'labelRail';

    rail.className =
      'labelRail';

    spacer.appendChild(rail);
    content.appendChild(spacer);

    rows.forEach(row => {
      surface.appendChild(
        buildDataRowElement(
          row,
          fields
        )
      );

      rail.appendChild(
        buildLabelRailItem(row)
      );
    });

    applyEditStateToControls();

    requestAnimationFrame(() => {
      updateFixedLayout();
      applySpeciesFilterDom();
      updateTableWidthFromScale();
      setupPinchZoom();
      scheduleLabelRailSync();
    });

  function gridTemplate(fields) {
    if (
      fields.length === 1 &&
      fields[0].type === 'select'
    ) {
      return '105px minmax(0,1fr)';
    }

    return `105px repeat(${fields.length}, minmax(0,1fr))`;
  }

  function headerGridTemplate(fields, scale=tableScale) {
    const labelWidth =
      105 * scale;

    if (
      fields.length === 1 &&
      fields[0].type === 'select'
    ) {
      return `${labelWidth}px minmax(0,1fr)`;
    }

    return `${labelWidth}px repeat(${fields.length}, minmax(0,1fr))`;
  }

  function refreshLabelRail() {
    const rail =
      document.getElementById('labelRail');

    const surface =
      document.getElementById('zoomSurface');

    if (!rail || !surface) return;

    const rows =
      Array.from(
        surface.querySelectorAll('.dataRow')
      );

    const items =
      Array.from(
        rail.querySelectorAll('.labelRailItem')
      );

    rows.forEach((row, index) => {
      const item =
        items[index];

      if (!item) return;

      const style =
        getComputedStyle(row);

      const marginBottom =
        parseFloat(
          style.marginBottom
        ) || 0;

      item.style.height =
        Math.ceil(
          row.offsetHeight * tableScale
        ) + 'px';

      item.style.marginBottom =
        Math.ceil(
          marginBottom * tableScale
        ) + 'px';

      item.style.fontSize =
        Math.min(
          28,
          15 * tableScale
        ) + 'px';

      item.classList.toggle(
        'pending',
        row.classList.contains(
          'pendingRow'
        )
      );
    });

    rail.style.width =
      (105 * tableScale) + 'px';
  }

  function syncLabelRailX() {
    const content =
      document.getElementById('content');

    const rail =
      document.getElementById('labelRail');

    if (!content || !rail) return;

    rail.style.transform =
      `translate3d(${content.scrollLeft}px, 0, 0)`;
  }

  function scheduleLabelRailSync() {
    if (labelSyncFrame) return;

    labelSyncFrame =
      requestAnimationFrame(() => {
        labelSyncFrame = null;
        syncLabelRailX();
      });
  }

  function queueChange(row, field, value) {
    const key = [
      currentSpot,
      currentTarget,
      row,
      field
    ].join('|');

    pending[key] = {
      spot: currentSpot,
      target: currentTarget,
      row,
      field,
      value,
      ts: Date.now()
    };

    persistPending();
    updatePendingStatus();
    saveLocalCacheFromMemory(
      currentSpot,
      currentTarget
    );

    // If Label rows are still being created on the server,
    // keep checkbox/species changes locally until that structural save finishes.
    if (
      hasActiveLabelAdd(currentSpot)
    ) {
      setSync(
        'Label 저장 후 변경사항 자동 저장 예정'
      );
      return;
    }

    if (!navigator.onLine) {
      setSync('오프라인 — 연결되면 자동 저장');
      return;
    }

    setSync('변경사항 대기 중...');
    scheduleSync(SYNC_DELAY_MS);
  }

  function scheduleSync(delay=SYNC_DELAY_MS) {
    clearTimeout(syncTimer);
    syncTimer = setTimeout(
      syncNow,
      delay
    );
  }

  function syncNow(callback) {
    if (syncing) {
      syncAgain = true;

      if (callback) {
        setTimeout(
          () => syncNow(callback),
          250
        );
      }

      return;
    }

    if (!navigator.onLine) {
      setSync('오프라인 — 동기화 대기');

      if (callback) callback(false);
      return;
    }

    const keys = Object.keys(pending);

    if (!keys.length) {
      setSync('저장됨 ✓');
      updatePendingStatus();

      if (callback) callback(true);
      return;
    }

    syncing = true;

    const sentSnapshot = {};

    const changes = keys.map(k => {
      sentSnapshot[k] = pending[k].ts;

      const {ts, ...change} = pending[k];
      return change;
    });

    setSync(`${changes.length}건 저장 중...`);

    google.script.run
      .withSuccessHandler(result => {
        for (const k of keys) {
          if (
            pending[k] &&
            pending[k].ts === sentSnapshot[k]
          ) {
            delete pending[k];
          }
        }

        persistPending();

        syncing = false;
        updatePendingStatus();
        refreshPendingRowStyles();

        if (Object.keys(pending).length === 0) {
          setSync(`저장됨 ✓ (${result.saved}건)`);

          setTimeout(() => {
            if (
              !syncing &&
              Object.keys(pending).length === 0
            ) {
              setSync('');
            }
          }, 1300);
        } else {
          setSync(
            `${Object.keys(pending).length}건 추가 동기화 대기`
          );
        }

        if (
          syncAgain ||
          Object.keys(pending).length
        ) {
          syncAgain = false;
          scheduleSync(250);
        }

        if (callback) callback(true);
      })
      .withFailureHandler(err => {
        syncing = false;
        persistPending();
        updatePendingStatus();

        setSync(
          `저장 실패 — ${Object.keys(pending).length}건 기기에 보관됨`
        );

        console.error(err);

        if (navigator.onLine) {
          scheduleSync(3500);
        }

        if (callback) callback(false);
      })
      .saveChangesBatch(changes);
  }

  function loadPending() {
    try {
      return JSON.parse(
        localStorage.getItem(STORAGE_PENDING) || '{}'
      );
    } catch (e) {
      return {};
    }
  }

  function persistPending() {
    localStorage.setItem(
      STORAGE_PENDING,
      JSON.stringify(pending)
    );
  }

  function applyPendingOverlay(rows, spot, target) {
    if (!rows) return;

    const rowMap = new Map(
      rows.map(r => [Number(r.row), r])
    );

    Object.values(pending).forEach(ch => {
      if (
        ch.spot !== spot ||
        ch.target !== target
      ) return;

      const r = rowMap.get(Number(ch.row));

      if (r) {
        r[ch.field] = ch.value;

        if (
          target === 'Multiplex' &&
          ch.field === 'species'
        ) {
          r.multiplexSpecies =
            ch.value;
        }
      }
    });
  }

  function rowHasPending(spot, target, row) {
    return Object.values(pending).some(ch =>
      ch.spot === spot &&
      ch.target === target &&
      Number(ch.row) === Number(row)
    );
  }

  function refreshPendingRowStyles() {
    const dataRows =
      Array.from(
        document.querySelectorAll('.dataRow')
      );

    const railItems =
      Array.from(
        document.querySelectorAll('.labelRailItem')
      );

    dataRows.forEach((el, index) => {
      const row =
        Number(el.dataset.row);

      const isPending =
        rowHasPending(
          currentSpot,
          currentTarget,
          row
        );

      el.classList.toggle(
        'pendingRow',
        isPending
      );

      if (railItems[index]) {
        railItems[index].classList.toggle(
          'pending',
          isPending
        );
      }
    });

    refreshLabelRail();
  }

  function updatePendingStatus() {
    const n = Object.keys(pending).length;
    const el = document.getElementById('pendingText');

    el.textContent =
      n ? `동기화 대기 ${n}건` : '';
  }

  function updateNetworkState() {
    const el = document.getElementById('syncText');

    if (!navigator.onLine) {
      el.textContent = '오프라인';
      el.classList.add('offline');
    } else {
      el.classList.remove('offline');
    }
  }

  function setSync(text) {
    const el = document.getElementById('syncText');

    el.textContent = text;

    if (!navigator.onLine) {
      el.classList.add('offline');
    } else {
      el.classList.remove('offline');
    }
  }

  function saveLocalCache(spot, target, rows) {
    try {
      localStorage.setItem(
        storageCacheKey(spot, target),
        JSON.stringify({
          savedAt: Date.now(),
          rows
        })
      );
    } catch (e) {
      console.warn(
        'cache save failed',
        e
      );
    }
  }

  function saveLocalCacheFromMemory(spot, target) {
    const rows = memoryCache[
      viewKey(spot, target)
    ];

    if (rows) {
      saveLocalCache(
        spot,
        target,
        rows
      );
    }
  }

  function loadLocalCache(spot, target) {
    try {
      const raw = localStorage.getItem(
        storageCacheKey(spot, target)
      );

      if (!raw) return null;

      const parsed = JSON.parse(raw);

      if (
        !parsed ||
        !Array.isArray(parsed.rows)
      ) {
        return null;
      }

      return parsed;
    } catch (e) {
      return null;
    }
  }

  function openStats() {
    document
      .getElementById('statsModal')
      .classList.add('show');

    document
      .getElementById('statsTitle')
      .textContent =
        currentSpot + ' 통계';

    if (!navigator.onLine) {
      document
        .getElementById('statsContent')
        .innerHTML =
          '<div class="empty">' +
          '통계는 최신 Sheet 값을 읽어야 하므로 온라인 상태에서 확인해주세요.<br>' +
          '현재 변경사항은 기기에 보관되어 있습니다.' +
          '</div>';
      return;
    }

    document
      .getElementById('statsContent')
      .innerHTML =
        '<div class="loading">' +
        '변경사항 동기화 후 통계를 불러오는 중...' +
        '</div>';

    syncNow(ok => {
      if (!ok) {
        document
          .getElementById('statsContent')
          .innerHTML =
            '<div class="empty">' +
            '동기화에 실패해 통계를 불러오지 않았습니다.' +
            '</div>';
        return;
      }

      google.script.run
        .withSuccessHandler(renderStats)
        .withFailureHandler(err => {
          document
            .getElementById('statsContent')
            .innerHTML =
              '<div class="empty">' +
              '통계를 불러오지 못했습니다.' +
              '</div>';

          console.error(err);
        })
        .getStats(currentSpot);
    });
  }

  function closeStats() {
    document
      .getElementById('statsModal')
      .classList.remove('show');
  }

  function modalBackgroundClose(e) {
    if (e.target.id === 'statsModal') {
      closeStats();
    }
  }

  function renderStats(stats) {
    let html = '';

    const targetOrder = ['ITS2', 'COI', 'kdr', 'ace-1'];

    targetOrder.forEach(target => {
      if (!Object.prototype.hasOwnProperty.call(stats.targets, target)) return;

      const items = stats.targets[target];

      html +=
        `<div class="statCard">` +
        `<h3>${escapeHtml(target)}</h3>`;

        const statOrder = ['PCR', 'Gel', 'Band+', 'Seq sent'];

        statOrder.forEach(name => {
          // 해당 target에 실제로 존재하는 항목만 표시
          if (!Object.prototype.hasOwnProperty.call(items, name)) return;

          const x = items[name];

          const pct =
            x.d > 0
              ? Math.round(x.n / x.d * 100)
              : 0;

          const pctText =
            x.d > 0
              ? pct + '%'
              : '-';

          html += `
            <div class="statLine">
              <div>${escapeHtml(name)}</div>
              <div class="bar">
                <div style="width:${Math.min(100,pct)}%"></div>
              </div>
              <div style="text-align:right">
                ${x.n}/${x.d} (${pctText})
              </div>
            </div>
          `;
        });

      html += '</div>';
    });

    const m = stats.multiplex;

    const resultStat =
      m.result || {
        n: m.n || 0,
        d: m.d || 0
      };

    const speciesIdStat =
      m.speciesId || {
        n: Object.entries(m.species || {})
          .filter(([sp]) => sp.startsWith('An. '))
          .reduce((sum, [, n]) => sum + Number(n || 0), 0),
        d: m.d || 0
      };

    const pctText = x =>
      x.d > 0
        ? Math.round(x.n / x.d * 100) + '%'
        : '-';

    html +=
      `<div class="statCard">` +
      `<h3>Multiplex Species</h3>` +
      `<div class="statLine">` +
        `<div>Result</div>` +
        `<div class="bar"><div style="width:${resultStat.d > 0 ? Math.min(100, Math.round(resultStat.n / resultStat.d * 100)) : 0}%"></div></div>` +
        `<div style="text-align:right">${resultStat.n}/${resultStat.d} (${pctText(resultStat)})</div>` +
      `</div>` +
      `<div class="statLine">` +
        `<div>Species ID</div>` +
        `<div class="bar"><div style="width:${speciesIdStat.d > 0 ? Math.min(100, Math.round(speciesIdStat.n / speciesIdStat.d * 100)) : 0}%"></div></div>` +
        `<div style="text-align:right">${speciesIdStat.n}/${speciesIdStat.d} (${pctText(speciesIdStat)})</div>` +
      `</div>` +
      `<div class="speciesGrid">`;

    const speciesEntries =
      Object.entries(m.species);

    const orderedSpecies = [
      ...speciesEntries.filter(
        ([sp]) => sp !== '결과 애매'
      ),
      ...speciesEntries.filter(
        ([sp]) => sp === '결과 애매'
      )
    ];

    orderedSpecies.forEach(
      ([sp, n]) => {
        const pct =
          m.d > 0
            ? Math.round(Number(n || 0) / m.d * 100)
            : null;

        html +=
          `<div>${escapeHtml(sp)}</div>` +
          `<div><b>${n}</b> · ${pct === null ? '-' : pct + '%'}</div>`;
      }
    );

    html += '</div></div>';

    document
      .getElementById('statsContent')
      .innerHTML = html;
  }

  function showFatal(err) {
    document
      .getElementById('content')
      .innerHTML =
        '<div class="empty">' +
        '오류가 발생했습니다.<br>' +
        escapeHtml(getErr(err)) +
        '</div>';
  }

  function getErr(err) {
    return err && err.message
      ? err.message
      : String(err || 'Unknown error');
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replaceAll('&','&amp;')
      .replaceAll('<','&lt;')
      .replaceAll('>','&gt;')
      .replaceAll('"','&quot;')
      .replaceAll("'","&#039;");
  }





  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('/sw.js')
        .catch(err => {
          console.error('Service worker registration failed:', err);
        });
    });
  }

  window.addEventListener('resize', () => {
    requestAnimationFrame(() => {
      updateFixedLayout();
      updateTableWidthFromScale();
    });
  });

  window.addEventListener('orientationchange', () => {
    setTimeout(updateFixedLayout, 150);
  });

  window.addEventListener('online', () => {
    updateNetworkState();
    setSync('온라인 복귀 — 동기화 준비');

    if (Object.keys(pending).length) {
      scheduleSync(250);
    } else {
      loadCurrent();
    }
  });

  window.addEventListener('offline', () => {
    updateNetworkState();
    clearTimeout(syncTimer);
  });

  document.addEventListener(
    'visibilitychange',
    () => {
      if (
        document.visibilityState === 'hidden' &&
        Object.keys(pending).length &&
        navigator.onLine
      ) {
        syncNow();
      }
    }
  );

  init();
</script>
</body>
</html>
